minimumReleaseAge: 4320 # 3 days just to be safe with the uptick of supply chain attacks

minimumReleaseAgeExclude:
  - '@thaz/temporal-util@1.0.0-rc.1'
  - '@thaz/typescript-config@1.0.0-rc.1'
  - '@thaz/oxfmt-config@1.0.0-rc.1'
  - '@thaz/oxlint-config@1.0.0-rc.1'

overrides:
  vite: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
